<!-- DIRISHA KAMILI LA SOGA (CHAT ROOM) -->
<div id="chatRoomModal" class="hidden fixed inset-0 bg-white z-50 flex flex-col justify-between">
    <!-- Header ya Juu ya Chat -->
    <div class="bg-purple-700 text-white px-4 py-3 flex items-center justify-between shadow">
        <div class="flex items-center space-x-3">
            <button onclick="closeChatRoom()" class="text-white p-1">
                <i data-lucide="arrow-left" class="w-6 h-6"></i>
            </button>
            <div>
                <h3 id="activeChatName" class="font-bold text-sm leading-tight">Juma Hassan</h3>
                <p class="text-[10px] text-green-300">Yuko hewani (Online)</p>
            </div>
        </div>
        <a id="whatsappChatLink" href="https://wa.me/255621319981" target="_blank" class="bg-green-500 hover:bg-green-600 text-white text-[11px] font-bold px-3 py-1.5 rounded-full shadow flex items-center space-x-1">
            <span>WhatsApp</span>
        </a>
    </div>

    <!-- Sehemu ya Kusoma Meseji -->
    <div id="chatMessagesBox" class="flex-1 p-4 overflow-y-auto space-y-3 bg-gray-50 text-xs">
        <div class="flex justify-start">
            <div class="bg-gray-200 text-gray-800 px-3.5 py-2.5 rounded-2xl max-w-[80%] shadow-sm">
                Habari! Nimefurahi kuona tumeendana hapa ZanziLove. Uko sehemu gani leo?
            </div>
        </div>
    </div>

    <!-- Sehemu ya Chini ya Kuandika Meseji -->
    <div class="p-3 bg-white border-t border-gray-200 flex items-center space-x-2">
        <input id="chatMessageInput" type="text" placeholder="Andika ujumbe wako..." class="flex-1 border border-gray-300 rounded-full px-4 py-2.5 text-xs focus:outline-purple-600">
        <button onclick="sendDirectMessage()" class="bg-purple-700 text-white p-2.5 rounded-full shadow hover:bg-purple-800">
            <i data-lucide="send" class="w-4 h-4"></i>
        </button>
    </div>
</div>
