<!DOCTYPE html>
<!-- KODI MPYA: FIREBASE IMEUNGANISHWA RASMI -->
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZanziLove - Penzi la Visiwani</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 flex justify-center font-sans antialiased select-none">

    <div class="w-full max-w-md bg-white min-h-screen flex flex-col justify-between shadow-2xl relative">
        
        <!-- Header -->
        <header class="bg-purple-700 text-white px-5 py-3.5 flex justify-between items-center sticky top-0 z-40 shadow">
            <div class="flex items-center space-x-2">
                <i data-lucide="heart" class="w-6 h-6 text-pink-300 fill-pink-300"></i>
                <h1 class="text-xl font-black tracking-wide">ZanziLove</h1>
            </div>
            <button onclick="logout()" class="text-[11px] bg-purple-800 hover:bg-purple-900 px-3 py-1 rounded-full border border-purple-400">
                Toka (Logout)
            </button>
        </header>

        <!-- MAUDHUI -->
        <main class="flex-1 p-4 overflow-y-auto no-scrollbar pb-24">

            <!-- 1. GUNDUA -->
            <section id="screen-discover" class="space-y-4">
                <div id="card-area">
                    <div class="text-center py-24 text-gray-400">
                        <i data-lucide="loader" class="w-8 h-8 animate-spin mx-auto text-purple-600 mb-2"></i>
                        <p class="text-xs">Inapakia watu waliojisajili...</p>
                    </div>
                </div>
            </section>

            <!-- 2. SOGA NA MECHI -->
            <section id="screen-matches" class="hidden space-y-4">
                <h2 class="text-lg font-bold text-purple-950">Meseji & Mechi Zako</h2>
                <div id="matches-list" class="space-y-2"></div>
            </section>

            <!-- 3. PREMIUM -->
            <section id="screen-premium" class="hidden space-y-4">
                <div class="bg-gradient-to-tr from-purple-800 to-indigo-900 text-white rounded-3xl p-5 text-center space-y-2">
                    <span class="bg-yellow-400 text-purple-950 text-[10px] font-black px-2.5 py-0.5 rounded-full uppercase">ZanziLove Gold</span>
                    <h3 class="text-xl font-bold">Ona Wanaokupenda</h3>
                    <div class="text-2xl font-extrabold text-yellow-300">TSh 2,000 <span class="text-xs text-white font-normal">/ Mwezi</span></div>
                </div>

                <div class="bg-white border border-purple-100 rounded-2xl p-4 shadow-sm space-y-3">
                    <h4 class="font-bold text-xs text-purple-950">Namba ya Malipo (M-Pesa / TigoPesa):</h4>
                    <div class="bg-purple-50 p-3 rounded-xl border border-purple-200 text-center font-bold text-purple-900 text-base">
                        0621319981 - NASSOR
                    </div>
                    <a href="https://wa.me/255621319981?text=Habari%20Nassor,%20nimetuma%20TSh%202000%20ya%20ZanziLove" target="_blank" class="block w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl text-center text-xs shadow">
                        💬 Thibitisha Malipo WhatsApp
                    </a>
                </div>
            </section>
        </main>

        <!-- Navigation Bar -->
        <nav class="bg-white border-t border-purple-100 px-6 py-2 flex justify-around items-center fixed bottom-0 w-full max-w-md z-40">
            <button onclick="changeTab('discover')" id="nav-discover" class="flex flex-col items-center text-purple-700 font-bold">
                <i data-lucide="flame" class="w-6 h-6"></i>
                <span class="text-[10px] mt-1">Gundua</span>
            </button>
            <button onclick="changeTab('matches')" id="nav-matches" class="flex flex-col items-center text-gray-400">
                <i data-lucide="message-circle" class="w-6 h-6"></i>
                <span class="text-[10px] mt-1">Soga (Chat)</span>
            </button>
            <button onclick="changeTab('premium')" id="nav-premium" class="flex flex-col items-center text-yellow-600 font-semibold">
                <i data-lucide="crown" class="w-6 h-6"></i>
                <span class="text-[10px] mt-1">Premium</span>
            </button>
        </nav>

        <!-- FOMU YA LAZIMA YA KUJISAJILI KWA WAPYA -->
        <div id="registerModal" class="hidden fixed inset-0 bg-purple-950/95 z-50 flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-sm rounded-3xl p-6 space-y-4 shadow-2xl">
                <div class="text-center">
                    <h3 class="text-xl font-black text-purple-950">Karibu ZanziLove!</h3>
                    <p class="text-xs text-gray-500 mt-1">Weka taarifa zako kuanza kuonana na wengine</p>
                </div>

                <div class="text-center space-y-2">
                    <img id="reg-pic-preview" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" class="w-20 h-20 rounded-full mx-auto object-cover border-2 border-purple-600 shadow">
                    <label class="cursor-pointer bg-purple-100 text-purple-700 text-xs px-3 py-1.5 rounded-full font-bold inline-block">
                        Chagua Picha kutoka Simuni
                        <input type="file" id="reg-pic-input" accept="image/*" class="hidden" onchange="handlePicUpload(event)">
                    </label>
                </div>

                <div class="space-y-2 text-xs">
                    <div>
                        <label class="font-bold text-gray-700">Jina Lako Kamili</label>
                        <input id="reg-name" placeholder="mf. Asha au Rashid" class="w-full border rounded-xl px-3 py-2 mt-0.5 focus:outline-purple-600" required>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="font-bold text-gray-700">Umri</label>
                            <input id="reg-age" type="number" placeholder="mf. 23" class="w-full border rounded-xl px-3 py-2 mt-0.5 focus:outline-purple-600" required>
                        </div>
                        <div>
                            <label class="font-bold text-gray-700">Eneo Lako</label>
                            <select id="reg-loc" class="w-full border rounded-xl px-2 py-2 mt-0.5 focus:outline-purple-600">
                                <option>Stone Town, Zanzibar</option>
                                <option>Nungwi, Zanzibar</option>
                                <option>Paje, Zanzibar</option>
                                <option>Chake Chake, Pemba</option>
                                <option>Dar es Salaam</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="font-bold text-gray-700">Kuhusu Wewe (Bio)</label>
                        <textarea id="reg-bio" rows="2" placeholder="Unapenda nini?" class="w-full border rounded-xl px-3 py-2 mt-0.5 focus:outline-purple-600"></textarea>
                    </div>
                </div>

                <button onclick="registerUser()" class="w-full bg-purple-700 hover:bg-purple-800 text-white font-bold py-3 rounded-2xl shadow transition">
                    Jiunge Sasa Bure
                </button>
            </div>
        </div>

        <!-- CHAT ROOM -->
        <div id="chatModal" class="hidden fixed inset-0 bg-white z-50 flex flex-col justify-between">
            <div class="bg-purple-700 text-white p-4 flex items-center justify-between shadow">
                <div class="flex items-center space-x-3">
                    <button onclick="closeChat()" class="text-white"><i data-lucide="arrow-left" class="w-6 h-6"></i></button>
                    <span id="chat-partner-name" class="font-bold text-base">Chat</span>
                </div>
            </div>

            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-2 text-xs"></div>

            <div class="p-3 border-t flex space-x-2 bg-gray-50">
                <input id="chat-input" placeholder="Andika ujumbe wako..." class="flex-1 border rounded-full px-4 py-2 text-xs focus:outline-purple-600">
                <button onclick="sendChatMessage()" class="bg-purple-700 text-white p-2.5 rounded-full">
                    <i data-lucide="send" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

    </div>

    <!-- FIREBASE YA NASSOR -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBTwz-oDGQJAw44k3X_cm06Sviw6ASuQC0",
            authDomain: "zanzilove-f4880.firebaseapp.com",
            databaseURL: "https://zanzilove-f4880-default-rtdb.firebaseio.com",
            projectId: "zanzilove-f4880",
            storageBucket: "zanzilove-f4880.firebasestorage.app",
            messagingSenderId: "330828885655",
            appId: "1:330828885655:web:0aa57141f605f9d420c3d2"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = JSON.parse(localStorage.getItem('zl_active_user')) || null;
        let allUsers = [];
        let currentIndex = 0;
        let compressedPic = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80";

        window.onload = function() {
            lucide.createIcons();
            if (!currentUser) {
                document.getElementById('registerModal').classList.remove('hidden');
            } else {
                fetchUsersFromCloud();
                listenToMatches();
            }
        };

        function handlePicUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = 250;
                        canvas.height = 250;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, 250, 250);
                        compressedPic = canvas.toDataURL('image/jpeg', 0.5);
                        document.getElementById('reg-pic-preview').src = compressedPic;
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function registerUser() {
            const name = document.getElementById('reg-name').value.trim();
            const age = document.getElementById('reg-age').value.trim();
            const loc = document.getElementById('reg-loc').value;
            const bio = document.getElementById('reg-bio').value.trim();

            if (!name || !age) {
                alert("Tafadhali jaza jina na umri wako!");
                return;
            }

            const userId = 'user_' + Date.now();
            currentUser = {
                id: userId,
                name: `${name}, ${age}`,
                location: loc,
                bio: bio || "Niko ZanziLove kutafuta mchumba.",
                pic: compressedPic
            };

            localStorage.setItem('zl_active_user', JSON.stringify(currentUser));
            db.ref('users/' + userId).set(currentUser);

            document.getElementById('registerModal').classList.add('hidden');
            fetchUsersFromCloud();
            listenToMatches();
        }

        function fetchUsersFromCloud() {
            db.ref('users').on('value', (snapshot) => {
                const data = snapshot.val();
                allUsers = [];
                if (data) {
                    for (let id in data) {
                        if (id !== currentUser.id) {
                            allUsers.push(data[id]);
                        }
                    }
                }
                renderDiscoverCard();
            });
        }

        function renderDiscoverCard() {
            const area = document.getElementById('card-area');
            if (allUsers.length === 0 || currentIndex >= allUsers.length) {
                area.innerHTML = `
                    <div class="text-center py-20 space-y-3">
                        <i data-lucide="users" class="w-12 h-12 text-purple-700 mx-auto"></i>
                        <h4 class="font-bold text-gray-800">Hakuna Watu Wapya Sasa!</h4>
                        <p class="text-xs text-gray-400">Watu wengine wakijisajili kwenye simu zao watatokea hapa mara moja.</p>
                        <button onclick="currentIndex = 0; renderDiscoverCard()" class="bg-purple-700 text-white text-xs px-4 py-2 rounded-xl">Angalia Tena</button>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            const p = allUsers[currentIndex];
            area.innerHTML = `
                <div class="rounded-3xl overflow-hidden shadow-lg border border-purple-100 relative bg-white">
                    <img src="${p.pic}" class="w-full h-96 object-cover">
                    <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent p-4 text-white">
                        <h3 class="text-2xl font-black">${p.name}</h3>
                        <p class="text-xs text-purple-200 mt-1">${p.location}</p>
                        <p class="text-xs text-gray-200 mt-2">${p.bio}</p>
                    </div>
                </div>
                <div class="flex justify-center space-x-6 mt-5">
                    <button onclick="currentIndex++; renderDiscoverCard()" class="w-14 h-14 bg-white border rounded-full flex items-center justify-center text-red-500 shadow hover:bg-gray-50">
                        <i data-lucide="x" class="w-7 h-7"></i>
                    </button>
                    <button onclick="likeUser('${p.id}', '${p.name}', '${p.pic}')" class="w-16 h-16 bg-purple-700 rounded-full flex items-center justify-center text-white shadow-lg hover:bg-purple-800">
                        <i data-lucide="heart" class="w-8 h-8 fill-current"></i>
                    </button>
                </div>
            `;
            lucide.createIcons();
        }

        function likeUser(targetId, targetName, targetPic) {
            db.ref(`likes/${targetId}/${currentUser.id}`).set(true);

            db.ref(`likes/${currentUser.id}/${targetId}`).once('value', (snap) => {
                if (snap.exists()) {
                    alert(`Hongera! Wewe na ${targetName} mmeendana! Mnaweza kuchat sasa.`);
                    const matchId = [currentUser.id, targetId].sort().join('_');
                    db.ref(`matches/${matchId}`).set({
                        user1: currentUser.id,
                        user2: targetId,
                        names: { [currentUser.id]: currentUser.name, [targetId]: targetName },
                        pics: { [currentUser.id]: currentUser.pic, [targetId]: targetPic }
                    });
                }
            });

            currentIndex++;
            renderDiscoverCard();
        }

        function listenToMatches() {
            db.ref('matches').on('value', (snap) => {
                const data = snap.val();
                const container = document.getElementById('matches-list');
                container.innerHTML = '';
                let count = 0;
                for (let mId in data) {
                    const match = data[mId];
                    if (match.user1 === currentUser.id || match.user2 === currentUser.id) {
                        count++;
                        const otherId = match.user1 === currentUser.id ? match.user2 : match.user1;
                        const otherName = match.names[otherId];
                        const otherPic = match.pics[otherId];

                        container.innerHTML += `
                            <div class="flex items-center space-x-3 p-3 bg-purple-50 rounded-2xl border border-purple-100">
                                <img src="${otherPic}" class="w-12 h-12 rounded-full object-cover">
                                <div class="flex-1">
                                    <h4 class="font-bold text-sm text-purple-950">${otherName}</h4>
                                    <p class="text-[10px] text-green-600 font-semibold">Mmeendana!</p>
                                </div>
                                <button onclick="openChat('${mId}', '${otherName}')" class="bg-purple-700 text-white text-xs px-3 py-1.5 rounded-xl font-bold">
                                    Chat
                                </button>
                            </div>
                        `;
                    }
                }
                if (count === 0) {
                    container.innerHTML = `<p class="text-xs text-center text-gray-400 py-10">Bado huna mechi. Like watu zaidi kwenye 'Gundua'.</p>`;
                }
                lucide.createIcons();
            });
        }

        let currentMatchId = null;
        function openChat(matchId, partnerName) {
            currentMatchId = matchId;
            document.getElementById('chat-partner-name').innerText = partnerName;
            document.getElementById('chatModal').classList.remove('hidden');

            db.ref(`messages/${matchId}`).on('value', (snap) => {
                const box = document.getElementById('chat-messages');
                box.innerHTML = '';
                const msgs = snap.val();
                for (let k in msgs) {
                    const m = msgs[k];
                    const isMe = m.sender === currentUser.id;
                    box.innerHTML += `
                        <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                            <div class="${isMe ? 'bg-purple-700 text-white' : 'bg-gray-200 text-gray-800'} px-3 py-2 rounded-2xl max-w-[75%]">
                                ${m.text}
                            </div>
                        </div>
                    `;
                }
                box.scrollTop = box.scrollHeight;
            });
            lucide.createIcons();
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !currentMatchId) return;

            db.ref(`messages/${currentMatchId}`).push({
                sender: currentUser.id,
                text: text,
                time: Date.now()
            });
            input.value = '';
        }

        function closeChat() {
            document.getElementById('chatModal').classList.add('hidden');
        }

        function changeTab(t) {
            ['discover', 'matches', 'premium'].forEach(s => {
                document.getElementById(`screen-${s}`).classList.add('hidden');
                document.getElementById(`nav-${s}`).classList.replace('text-purple-700', 'text-gray-400');
            });
            document.getElementById(`screen-${t}`).classList.remove('hidden');
            document.getElementById(`nav-${t}`).classList.replace('text-gray-400', 'text-purple-700');
            lucide.createIcons();
        }

        function logout() {
            if (confirm("Unataka kutoka kwenye akaunti yako?")) {
                localStorage.removeItem('zl_active_user');
                location.reload();
            }
        }
    </script>
</body>
</html>
