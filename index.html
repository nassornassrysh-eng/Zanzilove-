<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZanziLove - Penzi la Visiwani</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDK (Mawasiliano Mtandaoni) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-100 flex justify-center font-sans antialiased select-none">

    <div class="w-full max-w-md bg-white min-h-screen flex flex-col justify-between shadow-2xl relative">
        
        <!-- Header ya Juu -->
        <header class="bg-purple-700 text-white px-5 py-3.5 flex justify-between items-center sticky top-0 z-40 shadow">
            <div class="flex items-center space-x-2">
                <i data-lucide="heart" class="w-6 h-6 text-pink-300 fill-pink-300"></i>
                <h1 class="text-xl font-black tracking-wide">ZanziLove</h1>
            </div>
            <button onclick="openRegistrationModal()" class="text-xs bg-purple-800 hover:bg-purple-900 px-3 py-1.5 rounded-full border border-purple-400 font-semibold">
                Wasifu Wangu
            </button>
        </header>

        <!-- SEHEMU KUU ZA APP -->
        <main class="flex-1 p-4 overflow-y-auto no-scrollbar pb-24">

            <!-- 1. GUNDUA (DISCOVER) -->
            <section id="screen-discover" class="space-y-4">
                <div id="card-area">
                    <!-- Kadi itaingizwa hapa na JavaScript -->
                </div>
            </section>

            <!-- 2. SOGA NA MECHI (CHAT LIST) -->
            <section id="screen-matches" class="hidden space-y-4">
                <div class="flex justify-between items-center border-b pb-2">
                    <h2 class="text-lg font-bold text-purple-950">Mazungumzo (Soga)</h2>
                    <span id="chat-count-badge" class="bg-purple-100 text-purple-700 text-xs px-2.5 py-0.5 rounded-full font-bold">0</span>
                </div>
                <div id="conversations-list" class="space-y-2">
                    <!-- Watu wa kuchati nao wataingia hapa -->
                </div>
            </section>

            <!-- 3. PREMIUM (TSH 2,000) -->
            <section id="screen-premium" class="hidden space-y-4">
                <div class="bg-gradient-to-tr from-purple-800 to-indigo-900 text-white rounded-3xl p-6 shadow-lg text-center space-y-2">
                    <span class="bg-yellow-400 text-purple-950 text-xs font-black px-3 py-1 rounded-full uppercase">ZanziLove VIP</span>
                    <h3 class="text-2xl font-bold pt-2">ZanziLove Gold</h3>
                    <div class="text-3xl font-extrabold text-yellow-300">TSh 2,000 <span class="text-xs text-white font-normal">/ Mwezi</span></div>
                    <p class="text-xs text-purple-200">Ongea na watu bila kikomo Zanzibar & Tanzania nzima!</p>
                </div>

                <div class="bg-white border border-purple-100 rounded-2xl p-4 shadow-sm space-y-3">
                    <h4 class="font-bold text-xs text-purple-950">Namba ya Malipo (M-Pesa / TigoPesa):</h4>
                    <div class="bg-purple-50 p-3 rounded-xl border border-purple-200 text-center font-bold text-purple-900 text-lg tracking-wide">
                        0621319981 - NASSOR
                    </div>
                    
                    <a href="https://wa.me/255621319981?text=Habari%20Nassor,%20nimetuma%20TSh%202,000%20ya%20ZanziLove%20Premium" target="_blank" class="block w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl text-center text-xs shadow flex items-center justify-center space-x-2">
                        <span>💬 Thibitisha Malipo WhatsApp</span>
                    </a>
                </div>
            </section>
        </main>

        <!-- Menyu ya Chini ya Simu -->
        <nav class="bg-white border-t border-purple-100 px-6 py-2 flex justify-around items-center fixed bottom-0 w-full max-w-md z-40">
            <button onclick="changeTab('discover')" id="nav-discover" class="flex flex-col items-center text-purple-700 font-bold">
                <i data-lucide="flame" class="w-6 h-6"></i>
                <span class="text-[10px] mt-1">Gundua</span>
            </button>
            <button onclick="changeTab('matches')" id="nav-matches" class="flex flex-col items-center text-gray-400">
                <i data-lucide="message-circle" class="w-6 h-6"></i>
                <span class="text-[10px] mt-1">Soga</span>
            </button>
            <button onclick="changeTab('premium')" id="nav-premium" class="flex flex-col items-center text-yellow-600 font-semibold">
                <i data-lucide="crown" class="w-6 h-6"></i>
                <span class="text-[10px] mt-1">Premium</span>
            </button>
        </nav>

        <!-- DIRISHA LA USAJILI WA LAZIMA (SIGN UP) -->
        <div id="registerModal" class="hidden fixed inset-0 bg-purple-950/95 z-50 flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-sm rounded-3xl p-6 space-y-4 shadow-2xl">
                <div class="text-center">
                    <h3 class="text-xl font-black text-purple-950">Karibu ZanziLove! ❤️</h3>
                    <p class="text-xs text-gray-500 mt-1">Jaza fomu hii kuanza kuona na kuchati na watu</p>
                </div>

                <div class="text-center space-y-2">
                    <img id="reg-pic-preview" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" class="w-20 h-20 rounded-full mx-auto object-cover border-2 border-purple-600 shadow">
                    <label class="cursor-pointer bg-purple-100 text-purple-700 text-xs px-3 py-1.5 rounded-full font-bold inline-block hover:bg-purple-200">
                        Weka Picha Yako
                        <input type="file" id="reg-pic-input" accept="image/*" class="hidden" onchange="processImageUpload(event)">
                    </label>
                </div>

                <div class="space-y-2 text-xs">
                    <div>
                        <label class="font-bold text-gray-700">Jina Lako na Umri</label>
                        <input id="reg-name" placeholder="mf. Asha, 22" class="w-full border rounded-xl px-3 py-2 mt-0.5 focus:outline-purple-600" required>
                    </div>
                    <div>
                        <label class="font-bold text-gray-700">Eneo Unapoishi</label>
                        <select id="reg-loc" class="w-full border rounded-xl px-3 py-2 mt-0.5 focus:outline-purple-600">
                            <option>Stone Town, Zanzibar</option>
                            <option>Nungwi, Zanzibar</option>
                            <option>Paje, Zanzibar</option>
                            <option>Chake Chake, Pemba</option>
                            <option>Dar es Salaam</option>
                            <option>Arusha</option>
                        </select>
                    </div>
                    <div>
                        <label class="font-bold text-gray-700">Kuhusu Wewe (Bio)</label>
                        <textarea id="reg-bio" rows="2" placeholder="Unapenda nini?" class="w-full border rounded-xl px-3 py-2 mt-0.5 focus:outline-purple-600"></textarea>
                    </div>
                </div>
