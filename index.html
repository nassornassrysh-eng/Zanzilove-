<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZanziLove - Pata Penzi Visiwani</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { -webkit-tap-highlight-color: transparent; }
        
        /* Uhuishaji wa kadi ya Tinder */
        .card-swipe-left {
            transform: translateX(-150%) rotate(-25deg) !important;
            opacity: 0;
            transition: all 0.35s ease-out;
        }
        .card-swipe-right {
            transform: translateX(150%) rotate(25deg) !important;
            opacity: 0;
            transition: all 0.35s ease-out;
        }
        .card-active {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body class="bg-gray-900 flex justify-center items-center min-h-screen font-sans antialiased select-none">

    <!-- Kontena Kuu la Simu ya Tinder -->
    <div class="w-full max-w-md bg-white min-h-screen sm:min-h-[844px] sm:max-h-[844px] flex flex-col justify-between relative overflow-hidden sm:rounded-3xl shadow-2xl">
        
        <!-- 1. HEADER YA JUU MTINDO WA TINDER -->
        <header class="bg-white border-b border-gray-100 px-5 py-3 flex justify-between items-center z-30">
            <!-- Profile Button -->
            <button onclick="changeTab('profile')" id="hdr-btn-profile" class="p-1 rounded-full text-gray-400 hover:text-purple-700 transition">
                <i data-lucide="user" class="w-7 h-7"></i>
            </button>

            <!-- ZanziLove Flame / Logo -->
            <div class="flex items-center space-x-1 cursor-pointer" onclick="changeTab('discover')">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-purple-700 to-pink-500 flex items-center justify-center shadow-md">
                    <i data-lucide="flame" class="w-5 h-5 text-white fill-white"></i>
                </div>
                <h1 class="text-2xl font-black bg-gradient-to-r from-purple-700 to-pink-600 bg-clip-text text-transparent tracking-tight">ZanziLove</h1>
            </div>

            <!-- Messages / Chat Button -->
            <button onclick="changeTab('matches')" id="hdr-btn-chat" class="p-1 rounded-full text-gray-400 hover:text-purple-700 relative transition">
                <i data-lucide="message-circle" class="w-7 h-7"></i>
                <span id="chat-badge" class="hidden absolute top-0 right-0 w-2.5 h-2.5 bg-pink-500 rounded-full border-2 border-white"></span>
            </button>
        </header>

        <!-- 2. MAUDHUI YA NDANI (SCREENS) -->
        <main class="flex-1 relative overflow-hidden flex flex-col">

            <!-- ================= SCREEN 1: TINDER SWIPE DISCOVER ================= -->
            <section id="screen-discover" class="flex-1 flex flex-col justify-between p-3 relative">
                
                <!-- Eneo la Kadi ya Picha (Card Deck) -->
                <div class="flex-1 relative flex items-center justify-center">
                    <div id="card-stage" class="w-full h-[62vh] relative">
                        <!-- Kadi ya Tinder itaingizwa hapa na JavaScript -->
                    </div>
                </div>

                <!-- VITUFE VYA CHINI VYA TINDER (ACTION BUTTONS) -->
                <div class="flex justify-center items-center space-x-4 py-2 z-20">
                    <!-- Rewind / Rudia -->
                    <button onclick="restartCards()" class="w-11 h-11 bg-white border border-yellow-200 rounded-full flex items-center justify-center text-yellow-500 shadow-md active:scale-90 transition">
                        <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                    </button>

                    <!-- Pass / Kataa (X) -->
                    <button onclick="swipe('left')" class="w-16 h-16 bg-white border border-rose-200 rounded-full flex items-center justify-center text-rose-500 shadow-xl active:scale-90 transition hover:bg-rose-50">
                        <i data-lucide="x" class="w-8 h-8 stroke-[3]"></i>
                    </button>

                    <!-- Super Like (Star) -->
                    <button onclick="superLike()" class="w-11 h-11 bg-white border border-blue-200 rounded-full flex items-center justify-center text-blue-500 shadow-md active:scale-90 transition hover:bg-blue-50">
                        <i data-lucide="star" class="w-5 h-5 fill-blue-500"></i>
                    </button>

                    <!-- Like / Penda (Heart) -->
                    <button onclick="swipe('right')" class="w-16 h-16 bg-gradient-to-tr from-purple-700 to-pink-500 rounded-full flex items-center justify-center text-white shadow-xl active:scale-90 transition hover:opacity-95">
                        <i data-lucide="heart" class="w-8 h-8 fill-white"></i>
                    </button>

                    <!-- Boost / Premium -->
                    <button onclick="changeTab('premium')" class="w-11 h-11 bg-white border border-purple-200 rounded-full flex items-center justify-center text-purple-700 shadow-md active:scale-90 transition hover:bg-purple-50">
                        <i data-lucide="zap" class="w-5 h-5 fill-purple-700"></i>
                    </button>
                </div>
            </section>

            <!-- ================= SCREEN 2: MECHI NA SOGA (TINDER CHAT) ================= -->
            <section id="screen-matches" class="hidden flex-1 overflow-y-auto p-4 no-scrollbar space-y-4">
                
                <!-- Sehemu ya Juu: Mechi Mpya (New Matches Stories) -->
                <div>
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Mechi Mpya
